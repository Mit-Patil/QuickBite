spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: restaurant-order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: restaurant-order-service-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.quickbite.restaurant_order_service.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.quickbite.restaurant_order_service.dto.OrderEvent
      
kafka:
  topic:
    order-events: order-events
    
server:
  port: 8082
  
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  
order:
  tax-rate: 0.05
  delivery-fee: 30.00

logging:
  level:
    org.springframework.security: DEBUG  
    
internal:
  service-secret: ${INTERNAL_SERVICE_SECRET}    
  
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  
  