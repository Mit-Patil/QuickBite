spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: restaurant-order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8082
  
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  
order:
  tax-rate: 0.05
  delivery-fee: 30.00

logging:
  level:
    org.springframework.security: DEBUG  